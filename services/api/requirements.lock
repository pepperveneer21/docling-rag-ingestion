# Complete Python 3.11 resolution for the API runtime, the Docling ingestion
# stack, tests, and quality tools.
#
# EVERY dependency - direct AND transitive - is pinned to an exact version below.
# That includes the full Docling ML stack (torch, torchvision, docling-core,
# docling-ibm-models, tokenizers, transformers, huggingface_hub, safetensors,
# numpy, scipy, pandas, ...) so a fresh clone's real ingest runs against exactly
# this resolution. Setup and CI install this file (pip install -r
# requirements.lock); requirements.txt holds the human-edited lower bounds.
#
# Platform: resolved for CPython 3.11 with wheels available for BOTH linux
# x86_64 (CI runs `pnpm verify`) and macOS arm64 (local verify/screenshot). The
# CPU torch build is used - no CUDA wheels are pinned. numpy is held below 2.0 so
# a fresh clone cannot pull numpy 2.x and break the Docling parse. Pins carry no
# environment markers, so Windows is unsupported here (e.g. uvloop ships no
# Windows wheels); regenerate with a marker-preserving tool (pip-compile) if
# Windows support is ever needed.
#
# docling-core is pinned to 2.36.0 deliberately. docling 2.7.0 declares
# docling-core>=2.4.0,<3.0.0, but the top of that range (2.8x) drops the
# DocumentConverter symbols docling 2.7.0 imports, while the 2.4-2.7 line predates
# the HybridChunker `.contextualize()` API that app/repo/docling_engine.py calls.
# The 2.36.x line satisfies both, and its `[chunking]` extra deps (semchunk, mpire,
# multiprocess, dill) are captured below so token-aware chunking works end-to-end.
#
# Regenerate ONLY from a clean Python 3.11 virtual environment as documented in
# docs/dev-workflows.md#python-dependency-updates, then review the lock and the
# OpenAPI contract together. Docling imports are lazy in
# app/repo/docling_engine.py, so `pnpm verify:api` runs its tests with the engine
# stubbed and does not import torch/docling even though they are pinned here.
